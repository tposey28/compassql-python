[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "compassql"
version = "0.1.0"
description = "Visualization recommendation engine (Python port of vega/compassql)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "datamodel-code-generator>=0.25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["compassql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
